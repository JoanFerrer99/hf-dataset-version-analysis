# Magatzem de la Fase 3: DuckDB + dbt (docs/architecture.md, secció 10).
# Bronze = una carpeta data/run_<id>/ (variable run_dir); silver = staging;
# intermediate = les mesures de cada versió i dataset, i els intervals k-means;
# gold = les dues estrelles (marts/core) i els marts de consulta (marts/analysis).
# S'executa des de l'arrel del repositori:
#   dbt build --project-dir warehouse --profiles-dir warehouse --vars '{run_dir: data/run_9}'
name: hf_changes
version: "1.0.0"
config-version: 2
profile: hf_changes

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: target
clean-targets: ["target", "logs"]

flags:
  send_anonymous_usage_stats: false

vars:
  # Carpeta de l'execució que es llegeix, relativa a l'arrel del repositori.
  # Per defecte, la fixture sintètica de la CI.
  run_dir: tests/fixtures/run_sample
  # Validació de Census Income (validate_census_income.py), també relativa a l'arrel.
  census_dir: data/census_income/run_2

models:
  hf_changes:
    staging:
      +materialized: view
    intermediate:
      +materialized: table
    marts:
      +materialized: table
