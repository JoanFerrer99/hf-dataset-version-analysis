# Ús:
#   docker compose build
#
#   # Pipeline complet en un sol comandament (mostreig+elegibilitat, extracció
#   # de versions, i classificació de canvis dels elegibles -- tot encadenat,
#   # reutilitzant el mateix CSV entre fases):
#   docker compose run --rm run-pipeline --sample-size 50 --threads 4 --seed 42 --max-scanned 5000
#
# Scripts individuals (ús manual/depuració d'una sola fase):
#   # eligibility-scan -- NOMÉS Fase 0-1 (mostreig+elegibilitat), genera el CSV:
#   docker compose run --rm eligibility-scan --sample-size 50 --threads 4 --seed 42 --max-scanned 5000
#   ls data/eligibility_report_50_*.csv   # confirma el nom exacte (inclou el run_id)
#
#   # version-extractor -- Fase 1b (seqüència de versions per dataset elegible):
#   docker compose run --rm version-extractor --input data/run_<id>/eligibility_report.csv
#
#   # eligibility-scan --classify-versions -- Fase 2 (US-305), reclassificar les versions
#   # d'un run previ sense tornar a mostrejar (mateix servei eligibility-scan, flag diferent):
#   docker compose run --rm eligibility-scan --classify-versions data/run_<id>/versions.csv
#
#   # warehouse -- Fase 3, el magatzem (dbt build) d'una carpeta, a data/warehouse/run_<id>.duckdb:
#   docker compose run --rm warehouse --run-dir data/run_<id>
#
#   # ui -- la interfície a http://localhost:8501, amb el magatzem muntat de només lectura
#   # (per defecte data/warehouse/run_9.duckdb; un altre amb WAREHOUSE_FILE=...):
#   docker compose up ui
#
# Requereix un fitxer .env a l'arrel amb HF_TOKEN=hf_xxx (vegeu README.md).
# --remove-orphans neteja contenidors aturats d'execucions anteriors, no és
# obligatori (vegeu README.md per més detall).

services:
  run-pipeline:
    build: .
    image: hf-dataset-version-analysis:latest
    entrypoint: ["python", "src/run_pipeline.py"]
    env_file:
      - .env
    volumes:
      - ./data:/app/data

  eligibility-scan:
    build: .
    image: hf-dataset-version-analysis:latest
    entrypoint: ["python", "src/eligibility_scan.py"]
    env_file:
      - .env
    volumes:
      - ./data:/app/data

  version-extractor:
    build: .
    image: hf-dataset-version-analysis:latest
    entrypoint: ["python", "src/version_extractor.py"]
    env_file:
      - .env
    volumes:
      - ./data:/app/data

  warehouse:
    build: .
    image: hf-dataset-version-analysis:latest
    entrypoint: ["python", "src/build_warehouse.py"]
    volumes:
      - ./data:/app/data

  ui:
    build: .
    image: hf-dataset-version-analysis:latest
    entrypoint: ["streamlit", "run", "ui/app.py", "--server.address=0.0.0.0", "--server.port=8501",
                 "--server.headless=true", "--browser.gatherUsageStats=false"]
    environment:
      WAREHOUSE_PATH: /app/warehouse.duckdb
    ports:
      - "8501:8501"
    volumes:
      - ${WAREHOUSE_FILE:-./data/warehouse/run_9.duckdb}:/app/warehouse.duckdb:ro
