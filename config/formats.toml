# Formats tabulars del pipeline (decisions T-36 i T-44).
#
# - Només aquests formats compten com a dades tabulars: per a l'elegibilitat
#   (Fase 0) i per als fitxers del dataset que es comparen (Fase 2). Per
#   deixar-ne fora un, treu-lo de la llista.
# - Si una versió d'un dataset té fitxers tabulars de més d'un format, tots
#   formen el dataset: cada fitxer es llegeix en una taula i el format ja no
#   importa (decisió T-44).
# - Per a una sola execució, l'opció `--formats` (p.e. `--formats json,csv`)
#   substitueix aquesta llista, i llavors aquest fitxer no es llegeix (decisió
#   T-42).
#
# Formats que sap llegir el motor: csv, tsv, parquet, jsonl, json.
order = ["csv", "tsv", "parquet", "jsonl", "json"]
