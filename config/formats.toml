# Formats tabulars del pipeline, en ordre de preferència (decisió T-36).
#
# - Només aquests formats compten com a dades tabulars: per a l'elegibilitat
#   (Fase 0) i per a les taules que es comparen (Fase 2). Per deixar-ne fora
#   un, treu-lo de la llista.
# - Si una versió d'un dataset té fitxers tabulars de més d'un format, només es
#   compara el primer de la llista que hi surt. Els fitxers dels altres formats
#   queden a comparison_status.csv amb l'estat `excluded` (si han canviat).
#
# Formats que sap llegir el motor: csv, tsv, parquet, jsonl, json.
order = ["csv", "tsv", "parquet", "jsonl", "json"]
